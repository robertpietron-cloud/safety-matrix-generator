# =============================================================================
# Project : Safety Matrix Generator (GuardLogix SafetyTask -> Cause & Effect)
# File    : examples/portalsaw/config.yaml
# Author  : Robert Pietroń
# Revision: 1.0.0 (2026-10-18)
# Changes :
#   1.0.0 (2026-10-18) - Example project configuration of the PortalSaw line
#                        (matrix rev 1.0-1.4 lineage): zones, effect groups,
#                        device / output descriptions in PL, EN, FR and DA.
#                        The PLC export itself is NOT part of the repository.
# =============================================================================
# Usage:  safety-matrix analyze PortalSaw.L5K -c examples/portalsaw/config.yaml -o PortalSaw_matrix.xlsx
# Every key is optional - without a configuration the generator derives zones
# from routines, groups from output rungs and descriptions from I/O comments.
document:
  title: SAFETY MATRIX – PortalSaw (SafetyTask)
  author: Robert Pietroń
  revision: '1.5'
  date: '2026-10-18'
  revisions:
  - rev: '1.0'
    date: '2026-10-18'
    author: Robert Pietroń
    text:
      pl: Pierwsza wersja macierzy z programu PortalSaw20261007.L5K (Group Interlocks, MOTOR, VALVE, metadane, ścieżki, raport).
      en: First version of the matrix from program PortalSaw20261007.L5K (Group Interlocks, MOTOR, VALVE, metadata, paths, report).
      fr: Première version de la matrice à partir du programme PortalSaw20261007.L5K (Group Interlocks, MOTOR, VALVE, métadonnées, chemins, rapport).
      da: Første version af matrixen fra programmet PortalSaw20261007.L5K (Group Interlocks, MOTOR, VALVE, metadata, stier, rapport).
  - rev: '1.1'
    date: '2026-10-18'
    author: Robert Pietroń
    text:
      pl: Legendy oznaczeń na arkuszach macierzy i arkusz „Legenda”; autor dokumentu.
      en: Legends of designations on the matrix sheets and the "Legend" sheet; document author.
      fr: Légendes des repères sur les feuilles de matrice et feuille « Legend » ; auteur du document.
      da: Forklaringer af betegnelser på matrixarkene og arket "Legend"; dokumentets forfatter.
  - rev: '1.2'
    date: '2026-10-18'
    author: Robert Pietroń
    text:
      pl: Protokół testów walidacyjnych; arkusz funkcji bezpieczeństwa z czasami reakcji (CRTL z L5K) i polami PL; listy rozwijane kodów z automatycznym kolorowaniem;
        nowe pozycje [DO WERYFIKACJI] dot. RPI modułów.
      en: Validation test record; safety functions sheet with reaction times (CRTL from L5K) and PL fields; drop-down code lists with automatic colouring; new [TO
        BE VERIFIED] items on module RPI.
      fr: Procès-verbal d’essais de validation ; feuille des fonctions de sécurité avec temps de réponse (CRTL du L5K) et champs PL ; listes déroulantes de codes
        avec coloration automatique ; nouveaux éléments [À VÉRIFIER] sur le RPI des modules.
      da: Valideringstestprotokol; ark med sikkerhedsfunktioner med reaktionstider (CRTL fra L5K) og PL-felter; rullelister med koder og automatisk farvning; nye
        punkter [SKAL VERIFICERES] om modulernes RPI.
  - rev: '1.3'
    date: '2026-10-18'
    author: Robert Pietroń
    text:
      pl: Przełącznik języka PL / EN (arkusz Start + słownik); dwujęzyczne nazwy arkuszy.
      en: PL / EN language switch (Start sheet + dictionary); bilingual sheet names.
      fr: Sélecteur de langue PL / EN (feuille Start + dictionnaire) ; noms de feuilles bilingues.
      da: Sprogvælger PL / EN (arket Start + ordbog); tosprogede arknavne.
  - rev: '1.4'
    date: '2026-10-18'
    author: Robert Pietroń
    text:
      pl: Dodano języki francuski i duński w przełączniku (PL / EN / FR / DA).
      en: French and Danish added to the language switch (PL / EN / FR / DA).
      fr: Langues française et danoise ajoutées au sélecteur (PL / EN / FR / DA).
      da: Fransk og dansk tilføjet til sprogvælgeren (PL / EN / FR / DA).
  - rev: '1.5'
    date: '2026-10-18'
    author: Robert Pietroń
    text:
      pl: Macierz wygenerowana uniwersalnym generatorem safety-matrix-generator 1.0.0 (automatyczna analiza, raport i testy).
      en: Matrix generated with the universal safety-matrix-generator 1.0.0 (automatic analysis, report and tests).
      fr: Matrice générée avec le générateur universel safety-matrix-generator 1.0.0 (analyse, rapport et essais automatiques).
      da: Matrix genereret med den universelle safety-matrix-generator 1.0.0 (automatisk analyse, rapport og test).
