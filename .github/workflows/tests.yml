# =============================================================================
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install . pytest
      - run: python -m pytest -q
      - run: python tools/check_headers.py
      - run: safety-matrix analyze examples/demo/DemoCell.L5K -c examples/demo/config.yaml -o demo.xlsx --json demo.json
